# tasks.toml: tasks for `tsr` (https://tsr.opentechf.org/docs).
#   tsr --list            show the tasks
#   tsr <task> -- ARGS    run one, passing ARGS through

# Rebuild registry.zip from registry/packages (commit it; instances fetch
# it from the repository with `wpkg refresh`).
[tasks.registry]
run = "python3 scripts/build-wpkg-registry.py"

# The newest release of a pinned package: `tsr registry-latest -- nodejs 24`.
[tasks.registry-latest]
run = "python3 scripts/wpkg-registry.py latest"

# Pin a version of a pinned package: `tsr registry-add -- nodejs 24.22.0`.
[tasks.registry-add]
run = "python3 scripts/wpkg-registry.py add"
