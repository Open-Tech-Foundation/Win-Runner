[package]
name = "wincli"
version = "0.1.0"
edition = "2021"
description = "WinCLI: Linux-native PE32+ execution with in-memory WinFS and PS1 scripting"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
libc = "0.2"
rustyline = { version = "15", default-features = false }
serde_json = "1"
tungstenite = "=0.26.2"

[[bin]]
name = "wincli"
path = "src/main.rs"

[profile.release]
strip = true
