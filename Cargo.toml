[package]
name = "win-runner"
version = "0.1.0"
edition = "2021"
description = "Win-Runner: Linux-native Windows compatibility runtime with in-memory WinFS"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
libc = "0.2"
rustyline = { version = "15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "=0.22.2", default-features = false, features = ["bzip2", "ppmd", "deflate", "util"] }
tungstenite = "=0.26.2"

[[bin]]
name = "winrun"
path = "src/main.rs"

[lib]
name = "winrun"

[profile.release]
strip = true
